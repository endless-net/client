          type: string
    ServiceEvent:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - event_type
            - sequence
            - generated_at
          properties:
            event_type:
              type: string
              enum:
                - hello
                - status_changed
                - error
            sequence:
              type: integer
