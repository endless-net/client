# Status: active
# Owner: client
openapi: 3.1.0
info:
  title: EndlessNet Client Local Service IPC
  version: 2.0.0
  description: >
    Versioned local IPC contract between the EndlessNet background service and
    unprivileged local client processes. The HTTP shape is transported over a
    protected local channel; it is not a network listener. Every request must
    send the protocol, current-version, and minimum-supported-version headers.
    The server negotiates the highest overlapping version and returns it in the
    response envelope. This contract supports only version 2. Observer
    operations are available to every identified local peer. Owner operations
    are available to the SID/UID that first enrolls the device and to local
    administrators/root; initial enrollment claims an owner when none exists.
    An existing ownerless enrollment requires an administrator/root peer to
    claim ownership. Administrator operations always require such a peer.
servers:
  - url: http://endlessnet.local
    description: Placeholder authority used by local IPC clients.
x-endlessnet-transports:
  - platform: windows
    kind: windows_named_pipe
    endpoint: "\\\\.\\pipe\\endlessnet-service"
    default: true
  - platform: linux
    kind: unix_socket
    endpoint: "/run/endlessnet/client.sock"
  - platform: macos
    kind: unix_socket
    endpoint: "/var/run/endlessnet/client.sock"
x-endlessnet-recovery-helper:
  security: >
    The installed helper accepts only the closed operations and fixed
    arguments below. It never accepts an executable, arbitrary command,
    credential, token, state path, or IPC endpoint.
  windows:
    executable: "C:\\Program Files\\EndlessNet\\endlessnet-client-recovery-helper.exe"
    elevation: shell_execute_runas
  linux:
    executable: "/usr/libexec/endlessnet/endlessnet-client-recovery-helper"
    desktop_authorization: "polkit:ru.endlessnet.client.recovery"
    headless_authorization: sudo_or_root
  macos:
    executable: "/Library/PrivilegedHelperTools/ru.endlessnet.client.recovery-helper"
    desktop_authorization: "authorization_services_xpc:ru.endlessnet.client.recovery-helper"
    headless_authorization: root
  operations:
    - operation: trust_server_identity
      arguments:
        - --operation
        - trust-server-identity
        - --confirmed-control-origin
        - "{control_origin}"
        - --confirmed-key-id
        - "{announced_key_id}"
    - operation: forget_local_enrollment
      arguments:
        - --operation
        - forget-local-enrollment
        - --confirmed-local-forget
paths:
  /status:
    parameters: &ipcVersionHeaders
      - $ref: "#/components/parameters/IPCProtocol"
      - $ref: "#/components/parameters/IPCCurrentVersion"
      - $ref: "#/components/parameters/IPCMinimumVersion"
    get:
      operationId: status
      x-endlessnet-required-privilege: observer
      summary: Read current service state.
      responses:
        "200":
          description: Current service-visible state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /events:
    parameters: *ipcVersionHeaders
    get:
      operationId: events
      x-endlessnet-required-privilege: observer
      summary: Stream service events as newline-delimited JSON.
      description: >
        The service sends a hello event first, then a status_changed event for
        the current status, then additional status_changed events only when the
        service-visible status changes. Sequence numbers are stream-local and
        are not resume cursors. Clients should reconnect after EOF, then use
        the immediate snapshot rather than replaying an earlier sequence.
      x-ndjson: true
      responses:
        "200":
          description: Newline-delimited ServiceEvent values.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ServiceEvent"
        default:
          $ref: "#/components/responses/IPCError"
  /enroll:
    parameters: *ipcVersionHeaders
    post:
      operationId: enroll
      x-endlessnet-required-privilege: owner
      summary: Enroll this device using a one-time token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrollment accepted and local state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /connect:
    parameters: *ipcVersionHeaders
    post:
      operationId: connect
      x-endlessnet-required-privilege: owner
      summary: Clear local disconnect intent and bring the tunnel up.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Connect command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /server-identity:
    parameters: *ipcVersionHeaders
    get:
      operationId: server_identity
      x-endlessnet-required-privilege: observer
      summary: Compare the pinned and currently announced server signing identities.
      responses:
        "200":
          description: Server signing identity comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerIdentityResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /server-identity/trust:
    parameters: *ipcVersionHeaders
    post:
      operationId: server_identity.trust
      x-endlessnet-required-privilege: administrator
      summary: Explicitly trust a confirmed server signing identity, recover the node credential, and connect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustServerRequest"
      responses:
        "200":
          description: Trust recovery and connection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustServerResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /disconnect:
    parameters: *ipcVersionHeaders
    post:
      operationId: disconnect
      x-endlessnet-required-privilege: owner
      summary: Persist local disconnect intent and bring the tunnel down.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Disconnect command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /logout:
    parameters: *ipcVersionHeaders
    post:
      operationId: logout
      x-endlessnet-required-privilege: owner
      summary: Attempt bounded remote revocation, then clear local enrollment only after confirmation.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Logout command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /logout/local:
    parameters: *ipcVersionHeaders
    post:
      operationId: logout.local_forget
      x-endlessnet-required-privilege: administrator
      summary: Explicitly forget local enrollment when remote cleanup could not be confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalForgetRequest"
      responses:
        "200":
          description: Local enrollment was atomically cleared; remote credential status is unconfirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /networks:
    parameters: *ipcVersionHeaders
    get:
      operationId: networks
      x-endlessnet-required-privilege: observer
      summary: List service-visible networks for this enrollment.
      responses:
        "200":
          description: Networks known to the local service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworksResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /network/select:
    parameters: *ipcVersionHeaders
    post:
      operationId: network.select
      x-endlessnet-required-privilege: owner
      summary: Select the already-enrolled network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectNetworkRequest"
      responses:
        "200":
          description: Selected network result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectNetworkResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /diagnostics:
    parameters: *ipcVersionHeaders
    get:
      operationId: diagnostics
      x-endlessnet-required-privilege: owner
      summary: Read a redacted diagnostics snapshot without filesystem side effects.
      responses:
        "200":
          description: Redacted diagnostics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /diagnostics/bundle:
    parameters: *ipcVersionHeaders
    post:
      operationId: diagnostics.bundle
      x-endlessnet-required-privilege: owner
      summary: Create or reuse a bounded redacted diagnostics bundle.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                log_limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
      responses:
        "200":
          description: Diagnostics bundle metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsBundleResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /logs/recent:
    parameters: *ipcVersionHeaders
    get:
      operationId: logs.recent
      x-endlessnet-required-privilege: owner
      summary: Read recent redacted service log entries.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Recent service logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsRecentResponse"
        default:
          $ref: "#/components/responses/IPCError"
components:
  parameters:
    IPCProtocol:
      name: X-EndlessNet-IPC-Protocol
      in: header
      required: true
      schema:
        type: string
        const: endlessnet-client-ipc
    IPCCurrentVersion:
      name: X-EndlessNet-IPC-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 2
    IPCMinimumVersion:
      name: X-EndlessNet-IPC-Min-Supported-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 2
  responses:
    IPCError:
      description: Stable JSON IPC error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TrustServerRequest:
      type: object
      additionalProperties: false
      required:
        - confirmed_control_origin
        - confirmed_key_id
      properties:
        confirmed_control_origin:
          type: string
          format: uri
        confirmed_key_id:
          type: string
          minLength: 1
    LocalForgetRequest:
      type: object
      additionalProperties: false
      required:
        - confirmed
      properties:
        confirmed:
          type: boolean
          const: true
    ServerIdentityResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - control_origin
            - trusted_key_id
            - announced_key_id
            - changed
          properties:
            control_origin:
              type: string
              format: uri
            trusted_key_id:
              type: string
            announced_key_id:
              type: string
            changed:
              type: boolean
    ProtocolEnvelope:
      type: object
      required:
        - ipc_protocol
        - ipc_version
        - ipc_min_supported_version
      properties:
        ipc_protocol:
          type: string
          const: endlessnet-client-ipc
        ipc_version:
          type: integer
          const: 2
        ipc_min_supported_version:
          type: integer
          const: 2
        ipc_negotiated_version:
          type: integer
          minimum: 2
          description: Highest overlapping version; absent when negotiation fails before an overlap exists.
        service_version:
          type: string
        service_commit:
          type: string
        service_build_date:
          type: string
    ServiceState:
      type: string
      enum:
        - Connected
        - Disconnected
        - Degraded
        - Error
        - NeedsEnrollment
        - NeedsApproval
        - ServerIdentityChanged
        - Recovering
        - RecoveryBlocked
        - PolicyBlocked
        - NeedsLogin
    ControlState:
      type: string
      enum:
        - pending_approval
        - degraded
        - offline_cache
        - ready
        - registered
        - cache_invalid
        - error
        - not_registered
        - disconnected
        - server_identity_changed
        - recovering
        - recovery_blocked
        - policy_blocked
        - needs_login
    RecoveryOperation:
      type: string
      enum:
        - trust_server_identity
        - forget_local_enrollment
    RecoveryOperationOutcome:
      type: string
      enum:
        - accepted
        - already_applied
        - completed
    LogoutOutcome:
      type: string
      enum:
        - remote_cleanup_confirmed
        - remote_cleanup_unconfirmed
    RecoveryStatus:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        operation_id:
          type: string
        state:
          $ref: "#/components/schemas/ServiceState"
        error_code:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
    DesiredState:
      type: string
      enum:
        - connected
        - disconnected
    ConnectionIntent:
      type: object
      required:
        - desired_state
      properties:
        desired_state:
          $ref: "#/components/schemas/DesiredState"
        reason:
          type: string
        updated_at:
          type: string
          format: date-time
    StatusResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
            - control_state
            - desired_state
            - cached_map_present
            - cached_map_valid
            - map_signing_trust_present
            - token_present
            - node_credential_present
            - device_fingerprint_present
            - identity_private_key_present
            - private_key_present
          properties:
            state:
              $ref: "#/components/schemas/ServiceState"
            control_state:
              $ref: "#/components/schemas/ControlState"
            desired_state:
              $ref: "#/components/schemas/DesiredState"
            user_disconnected:
              type: boolean
            connection_intent:
              $ref: "#/components/schemas/ConnectionIntent"
            control_plane_urls:
              type: array
              items:
                type: string
            account_id:
              type: string
            node_id:
              type: string
            hostname:
              type: string
            network_id:
              type: string
            network_name:
              type: string
            node_approval_state:
              type: string
            enrollment_request_id:
              type: string
            approval_url:
              type: string
              format: uri
            overlay_ip:
              type: string
            overlay_ipv6:
              type: string
            overlay_cidr:
              type: string
            overlay_ipv6_cidr:
              type: string
            map_revision:
              type: integer
              minimum: 0
            peer_count:
              type: integer
              minimum: 0
            stun_endpoints:
              type: array
              items:
                $ref: "#/components/schemas/EndpointAddress"
            relay_endpoints:
              type: array
              items:
                $ref: "#/components/schemas/RelayEndpoint"
            map_signing_trust_present:
              type: boolean
            token_present:
              type: boolean
            cached_map_present:
              type: boolean
            cached_map_valid:
              type: boolean
            node_credential_present:
              type: boolean
            device_fingerprint_present:
              type: boolean
            identity_private_key_present:
              type: boolean
            private_key_present:
              type: boolean
            route_table:
              type: string
            local_state_error:
              type: string
            approval_error:
              type: string
            cached_map_error:
              type: string
            connection_intent_error:
              type: string
            recovery:
              $ref: "#/components/schemas/RecoveryStatus"
            agent:
              $ref: "#/components/schemas/AgentStatus"
            control:
              $ref: "#/components/schemas/ControlProbe"
            wireguard:
              $ref: "#/components/schemas/WireGuardInspection"
    EndpointAddress:
      type: object
      additionalProperties: false
      required:
        - id
        - addr
      properties:
        id:
          type: string
        addr:
          type: string
    RelayEndpoint:
      type: object
      additionalProperties: false
      required:
        - id
        - addr
      properties:
        id:
          type: string
        addr:
          type: string
        protocol:
          type: string
        priority:
          type: integer
          minimum: 0
    AgentSnapshotState:
      type: string
      description: |
        Relationship between the attached agent snapshot and the authoritative
        cached map exposed by the enclosing status. `previous` keeps the last
        coherent runtime snapshot visible after the cached map advances; its
        fields retain their own `map_revision`.
      enum:
        - absent
        - current
        - previous
    AgentStatus:
      type: object
      required:
        - state_present
        - snapshot_state
      additionalProperties: false
      properties:
        state_present:
          type: boolean
          description: True when snapshot fields are populated, including a previous-revision snapshot.
        snapshot_state:
          $ref: "#/components/schemas/AgentSnapshotState"
        target_map_revision:
          type: integer
          minimum: 0
          description: Authoritative cached map revision to reconcile when snapshot_state is previous.
        connection_paused:
          type: boolean
        generated_at:
          type: string
          format: date-time
        node_id:
          type: string
        network_id:
          type: string
        network_name:
          type: string
        overlay_ip:
          type: string
        overlay_ipv6:
          type: string
        map_revision:
          type: integer
          minimum: 0
        peer_count:
          type: integer
          minimum: 0
        stun_ok:
          type: boolean
        relay_ok:
          type: boolean
        selected_relay:
          $ref: "#/components/schemas/RelayEndpoint"
        relay_attempt_count:
          type: integer
        path_count:
          type: integer
        selected_path_counts:
          type: object
          additionalProperties:
            type: integer
        peers:
          type: array
          items:
            $ref: "#/components/schemas/PeerPathStatus"
        last_error:
          type: string
    PeerPathStatus:
      type: object
      additionalProperties: false
      required:
        - peer_id
        - hostname
        - direct
        - relay
        - selected_path
      properties:
        peer_id:
          type: string
        hostname:
          type: string
        direct:
          $ref: "#/components/schemas/PathCandidateStatus"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PathCandidateStatus"
        relay:
          $ref: "#/components/schemas/PathCandidateStatus"
        selected_path:
          type: string
        selected_endpoint:
          type: string
        last_transition_at:
          type: string
          format: date-time
        selection_reason:
          type: string
    PathCandidateStatus:
      type: object
      additionalProperties: false
      required:
        - type
        - state
      properties:
        type:
          type: string
        tier:
          type: string
        priority:
          type: integer
        state:
          type: string
        endpoint:
          type: string
        relay_id:
          type: string
        protocol:
          type: string
        rtt_ms:
          type: number
        checked_at:
          type: string
          format: date-time
        last_reachable_at:
          type: string
          format: date-time
        consecutive_failures:
          type: integer
        reason:
          type: string
    ControlProbe:
      type: object
      required:
        - ok
      additionalProperties: false
      properties:
        ok:
          type: boolean
        url:
          type: string
        http_status:
          type: integer
        error:
          type: string
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ControlProbe"
    ConnectResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
            - wireguard
          properties:
            state:
              $ref: "#/components/schemas/ServiceState"
            control_state:
              $ref: "#/components/schemas/ControlState"
            desired_state:
              $ref: "#/components/schemas/DesiredState"
            user_disconnected:
              type: boolean
            node_id:
              type: string
            network_id:
              type: string
            map_revision:
              type: integer
              minimum: 0
            wireguard:
              $ref: "#/components/schemas/WireGuardApplyResult"
    EnrollResponse:
      allOf:
        - $ref: "#/components/schemas/StatusResponse"
        - type: object
          properties:
            wireguard_apply:
              $ref: "#/components/schemas/WireGuardApplyResult"
              description: Present only after enrollment has synchronously brought up the local tunnel.
    TrustServerResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - operation_id
            - operation
            - outcome
            - state
            - control_state
            - trusted_key_id
          properties:
            operation_id:
              type: string
            operation:
              $ref: "#/components/schemas/RecoveryOperation"
            outcome:
              $ref: "#/components/schemas/RecoveryOperationOutcome"
            state:
              $ref: "#/components/schemas/ServiceState"
            control_state:
              $ref: "#/components/schemas/ControlState"
            trusted_key_id:
              type: string
    DisconnectResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
            - desired_state
            - user_disconnected
            - wireguard
          properties:
            state:
              $ref: "#/components/schemas/ServiceState"
            desired_state:
              $ref: "#/components/schemas/DesiredState"
            user_disconnected:
              type: boolean
            wireguard:
              $ref: "#/components/schemas/WireGuardApplyResult"
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
            - control_state
            - outcome
          properties:
            state:
              $ref: "#/components/schemas/ServiceState"
            control_state:
              $ref: "#/components/schemas/ControlState"
            outcome:
              $ref: "#/components/schemas/LogoutOutcome"
            remote_request_id:
              type: string
    SelectNetworkResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
            - desired_state
            - selected_network_id
            - selected_network
            - node_id
            - map_revision
          properties:
            state:
              $ref: "#/components/schemas/ServiceState"
            desired_state:
              $ref: "#/components/schemas/DesiredState"
            selected_network_id:
              type: string
            selected_network:
              $ref: "#/components/schemas/NetworkSummary"
            node_id:
              type: string
            map_revision:
              type: integer
              minimum: 0
    WireGuardApplyResult:
      type: object
      required:
        - ok
        - method
        - changed
      additionalProperties: false
      properties:
        ok:
          type: boolean
        method:
          type: string
          const: wireguard-go
        interface:
          type: string
        changed:
          type: boolean
        skipped:
          type: boolean
        reason:
          type: string
        down_error:
          type: string
        up_error:
          type: string
        sync_error:
          type: string
        route_error:
          type: string
    WireGuardInspection:
      type: object
      required:
        - ok
        - interface
        - peer_count
        - peers
      additionalProperties: false
      properties:
        ok:
          type: boolean
        interface:
          type: string
        mtu:
          type: integer
        listen_port:
          type: integer
        peer_count:
          type: integer
          minimum: 0
        peers:
          type: array
          items:
            $ref: "#/components/schemas/WireGuardPeerInspection"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/WireGuardRouteInspection"
        error:
          type: string
    WireGuardPeerInspection:
      type: object
      additionalProperties: false
      required:
        - public_key
        - allowed_ips
        - transfer_rx_bytes
        - transfer_tx_bytes
      properties:
        public_key:
          type: string
        endpoint:
          type: string
        allowed_ips:
          type: array
          items:
            type: string
        latest_handshake_unix:
          type: integer
        transfer_rx_bytes:
          type: integer
          minimum: 0
        transfer_tx_bytes:
          type: integer
          minimum: 0
        persistent_keepalive_seconds:
          type: integer
