        - unauthorized
        - owner_required
        - administrator_required
        - ipc_version_required
        - ipc_protocol_unsupported
        - ipc_version_unsupported
        - invalid_ipc_version_range
        - remote_cleanup_required
        - local_forget_confirmation_required
        - recovery_operation_invalid
        - recovery_operation_id_failed
        - local_forget_failed
        - network_ref_required
        - config_unavailable
        - client_state_format_unsupported
        - client_state_version_unsupported
        - approval_required
        - approval_rejected
        - network_map_unavailable
        - node_identity_missing
        - device_fingerprint_mismatch
        - wireguard_unavailable
        - connect_failed
        - connect_sync_failed
        - disconnect_failed
        - logout_failed
        - enrollment_failed
        - diagnostics_bundle_failed
        - diagnostics_bundle_unavailable
        - diagnostics_snapshot_failed
        - connection_intent_update_failed
        - network_selection_requires_enrollment
        - server_identity_changed
        - server_identity_unavailable
        - server_identity_confirmation_mismatch
        - server_identity_invalid
        - server_identity_update_failed
        - server_identity_recovery_failed
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - error_code
            - error
          properties:
            error_code:
              $ref: "#/components/schemas/ErrorCode"
            error:
              type: string
