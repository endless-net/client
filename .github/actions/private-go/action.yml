name: Configure private Go modules
description: Use the CI read token for private EndlessNet module downloads
runs:
  using: composite
  steps:
    - name: Configure GitHub credential helper
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::Set PRIVATE_MODULES_READ_TOKEN with read access to private EndlessNet Go module repositories. Fork PRs require a trusted CI run with that access."
          exit 1
        fi
        gh auth setup-git --hostname github.com
