name: Check source CI gate

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise publication gate against completed source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SOURCE_SHA="$(git rev-parse HEAD)"
          go run ./tools/verify-source-ci
