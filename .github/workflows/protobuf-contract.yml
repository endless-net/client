name: Protobuf contract

on:
  pull_request:
    paths:
      - "docs/client-ipc-protobuf.md"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "clientipc/**"
      - "packages/client_api/**"
      - "contracts/proto-baseline/**"
      - ".github/workflows/protobuf-contract.yml"
  push:
    branches: [main]
    paths:
      - "docs/client-ipc-protobuf.md"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "clientipc/**"
      - "packages/client_api/**"
      - "contracts/proto-baseline/**"
      - ".github/workflows/protobuf-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: clientipc/go.mod
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - name: Install pinned generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          go install golang.org/x/tools/cmd/goimports@v0.39.0
          dart pub global activate protoc_plugin 25.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Check canonical formatting
        run: buf format --diff --exit-code
      - name: Lint contract
        run: buf lint
      - name: Compile descriptor
        run: buf build -o client-ipc-v0.binpb
      - name: Check accepted contract baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s contracts/proto-baseline/client.binpb
          buf breaking proto --against contracts/proto-baseline/client.binpb
      - name: Verify RPC deletion is rejected
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          cp -R proto "$fixture/proto"
          cp buf.yaml "$fixture/buf.yaml"
          sed -i '/  rpc GetStatus(/,+2d' "$fixture/proto/client/v0/service.proto"
          buf build "$fixture"
          if buf breaking "$fixture" --against contracts/proto-baseline/client.binpb --error-format=json > "$fixture/breaking.json" 2>&1; then
            echo "::error::Breaking check accepted deletion of GetStatus"
            exit 1
          fi
          cat "$fixture/breaking.json"
          grep -q 'RPC_NO_DELETE' "$fixture/breaking.json"
      - name: Regenerate Go and Dart bindings
        run: |
          buf generate
          buf build -o clientipc/rpc/client.binpb
          goimports -w clientipc
          cd clientipc
          go run ./internal/dartmetadata
      - name: Test generated Go protocols
        working-directory: clientipc
        run: go test -short ./...
      - name: Resolve locked Dart dependencies
        working-directory: packages/client_api
        run: dart pub get --enforce-lockfile
      - name: Analyze Dart bindings
        working-directory: packages/client_api
        run: dart analyze --fatal-infos
      - name: Check generated artifacts are committed
        shell: bash
        run: |
          git diff --exit-code -- clientipc packages/client_api
          test -z "$(git ls-files --others --exclude-standard -- clientipc packages/client_api)"
      - uses: actions/upload-artifact@v7
        with:
          name: client-ipc-v0-descriptor
          path: client-ipc-v0.binpb
          if-no-files-found: error

  local-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: clientipc/go.mod
          cache: false
      - name: Test authenticated local gRPC
        working-directory: clientipc
        run: go test -short ./...
