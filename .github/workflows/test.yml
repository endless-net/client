name: Test

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      external_stun_compatibility:
        description: Verify the client against the pinned standalone STUN source
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || {
            printf '%s\n' "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client

  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Verify dependency licenses
        run: ./scripts/check-licenses.sh

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client

  external-stun-compatibility:
    name: External STUN compatibility
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_stun_compatibility }}
    runs-on: ubuntu-latest
    needs: [verify-linux, verify-windows, verify-macos]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out pinned STUN source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: endless-net/stun
          ref: v1.0.10
          path: .external/endlessnet-stun
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build standalone STUN binary
        env:
          GOFLAGS: ""
          GOWORK: off
        run: go build -o "$RUNNER_TEMP/endlessnet-stun" ./cmd/endlessnet-stun
        working-directory: .external/endlessnet-stun
      - name: Verify current client against standalone STUN
        env:
          ENDLESSNET_E2E_STUN_BINARY: ${{ runner.temp }}/endlessnet-stun
        run: go test ./internal/client -run '^TestCheckSTUNQueriesExternalStandaloneService$' -count=1
