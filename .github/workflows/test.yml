name: Test

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      external_stun_compatibility:
        description: Verify the client against the pinned standalone STUN source
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v2
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPRIVATE: github.com/endless-net/*
  GH_TOKEN: ${{ secrets.PRIVATE_MODULES_READ_TOKEN }}

jobs:
  verify-linux:
    name: Verify (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/private-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || {
            printf '%s\n' "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client ./cmd/endlessnet-client-recovery-helper

      - name: Verify sharing through encrypted WireGuard engines
        run: go test ./internal/client -run '^TestSharingEncryptedWireGuardDirectionAndWithdrawal$' -count=1 -timeout 45s

      - name: Verify established TCP and UDP ACL revocation in isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/acl-kernel.test" ./internal/client
          sudo env ENDLESSNET_REQUIRE_KERNEL_ACL_TEST=1 unshare --net -- \
            "$RUNNER_TEMP/acl-kernel.test" -test.run '^TestACLKernelEstablishedRevocation$' -test.v -test.timeout 30s

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/private-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client ./cmd/endlessnet-client-recovery-helper

  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/private-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Verify dependency licenses
        run: ./scripts/check-licenses.sh

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client ./cmd/endlessnet-client-recovery-helper

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [verify-linux, verify-windows, verify-macos]
    if: ${{ !cancelled() }}
    steps:
      - name: Require platform verification
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ needs.verify-linux.result }}" = "success" ]
          [ "${{ needs.verify-windows.result }}" = "success" ]
          [ "${{ needs.verify-macos.result }}" = "success" ]

  external-stun-compatibility:
    name: External STUN compatibility
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_stun_compatibility }}
    runs-on: ubuntu-latest
    needs: [verify-linux, verify-windows, verify-macos]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/private-go
      - name: Check out pinned STUN source
        uses: actions/checkout@v7
        with:
          repository: endless-net/stun
          ref: v1.0.10
          path: .external/endlessnet-stun
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build standalone STUN binary
        env:
          GOFLAGS: ""
          GOWORK: off
        run: go build -o "$RUNNER_TEMP/endlessnet-stun" ./cmd/endlessnet-stun
        working-directory: .external/endlessnet-stun
      - name: Verify current client against standalone STUN
        env:
          ENDLESSNET_E2E_STUN_BINARY: ${{ runner.temp }}/endlessnet-stun
        run: go test ./internal/client -run '^TestCheckSTUNQueriesExternalStandaloneService$' -count=1
