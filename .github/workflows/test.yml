name: Test

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      external_stun_compatibility:
        description: Verify the client against the pinned standalone STUN source
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v2
  # Finish the active platform matrix so every started source gets analysable evidence.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || {
            printf '%s\n' "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client ./cmd/endlessnet-client-recovery-helper

      - name: Verify sharing through encrypted WireGuard engines
        run: go test ./internal/client -run '^TestSharingEncryptedWireGuardDirectionAndWithdrawal$' -count=1 -timeout 45s

      - name: Verify established TCP and UDP ACL revocation in isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/acl-kernel.test" ./internal/client
          sudo env ENDLESSNET_REQUIRE_KERNEL_ACL_TEST=1 unshare --net -- \
            "$RUNNER_TEMP/acl-kernel.test" -test.run '^TestACLKernelEstablishedRevocation$' -test.v -test.timeout 30s

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client ./cmd/endlessnet-client-recovery-helper

  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Verify dependency licenses
        run: ./scripts/check-licenses.sh

      - name: Test
        run: go test -short ./...

      - name: Build client
        run: go build ./cmd/endlessnet-client ./cmd/endlessnet-client-recovery-helper

  installation:
    name: Install and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm, windows-2022, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare client and installation test executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install-test"
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          initial_version="${tag#v}"
          upgrade_version="${initial_version}+ci.1"
          go build -ldflags "-X main.version=$initial_version -X main.commit=$GITHUB_SHA" -o "$RUNNER_TEMP/install-test/endlessnet-client.exe" ./cmd/endlessnet-client
          go build -ldflags "-X main.version=$upgrade_version -X main.commit=$GITHUB_SHA" -o "$RUNNER_TEMP/install-test/endlessnet-client-upgrade.exe" ./cmd/endlessnet-client
          go build -o "$RUNNER_TEMP/install-test/packetprobe.exe" ./tools/packetprobe
          go test -c -o "$RUNNER_TEMP/install-test/installation.test.exe" ./tests
          echo "ENDLESSNET_TEST_UPGRADE_BINARY=$RUNNER_TEMP/install-test/endlessnet-client-upgrade.exe" >> "$GITHUB_ENV"
          echo "ENDLESSNET_TEST_INITIAL_VERSION=$initial_version" >> "$GITHUB_ENV"
          echo "ENDLESSNET_TEST_UPGRADE_VERSION=$upgrade_version" >> "$GITHUB_ENV"
      - name: Build Debian package using the existing release version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          VERSION="${tag#v}" OUTPUT_DIR="$RUNNER_TEMP/install-test" bash scripts/build-deb.sh "$(go env GOARCH)"
          deb=("$RUNNER_TEMP/install-test/"*.deb)
          [ "${#deb[@]}" -eq 1 ]
          [ "$(dpkg-deb --field "${deb[0]}" Architecture)" = "$(dpkg --print-architecture)" ]
          echo "ENDLESSNET_TEST_DEB=${deb[0]}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/install-test/upgrade"
          VERSION="${tag#v}+ci.1" OUTPUT_DIR="$RUNNER_TEMP/install-test/upgrade" bash scripts/build-deb.sh "$(go env GOARCH)"
          upgrade_deb=("$RUNNER_TEMP/install-test/upgrade/"*.deb)
          [ "${#upgrade_deb[@]}" -eq 1 ]
          echo "ENDLESSNET_TEST_UPGRADE_DEB=${upgrade_deb[0]}" >> "$GITHUB_ENV"
      - name: Prepare signed Wintun dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'install-test/wintun.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          # Published by https://www.wintun.net/; verify before extracting.
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw 'Wintun archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'install-test/wintun-extracted')
          $dll = Join-Path $env:RUNNER_TEMP 'install-test/wintun-extracted/wintun/bin/amd64/wintun.dll'
          "ENDLESSNET_TEST_WINTUN=$dll" >> $env:GITHUB_ENV
      - name: Install, exercise IPC, restart and uninstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ENDLESSNET_INSTALL_TEST=1 \
            ENDLESSNET_TEST_BINARY="$RUNNER_TEMP/install-test/endlessnet-client.exe" \
            ENDLESSNET_TEST_UPGRADE_BINARY="$ENDLESSNET_TEST_UPGRADE_BINARY" \
            ENDLESSNET_TEST_INITIAL_VERSION="$ENDLESSNET_TEST_INITIAL_VERSION" \
            ENDLESSNET_TEST_UPGRADE_VERSION="$ENDLESSNET_TEST_UPGRADE_VERSION" \
            ENDLESSNET_PACKET_PROBE="$RUNNER_TEMP/install-test/packetprobe.exe" \
            ENDLESSNET_TEST_DEB="${ENDLESSNET_TEST_DEB:-}" \
            ENDLESSNET_TEST_UPGRADE_DEB="${ENDLESSNET_TEST_UPGRADE_DEB:-}" \
            "$RUNNER_TEMP/install-test/installation.test.exe" \
            -test.run '^TestInstalledClient$' -test.v -test.timeout 8m \
            2>&1 | tee "$RUNNER_TEMP/install-test/results.log"
      - name: Install, exercise IPC, restart and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENDLESSNET_INSTALL_TEST: '1'
        run: |
          $env:ENDLESSNET_TEST_BINARY = Join-Path $env:RUNNER_TEMP 'install-test/endlessnet-client.exe'
          $env:ENDLESSNET_PACKET_PROBE = Join-Path $env:RUNNER_TEMP 'install-test/packetprobe.exe'
          & "$env:RUNNER_TEMP/install-test/installation.test.exe" '-test.run=^TestInstalledClient$' '-test.v' '-test.timeout=8m' 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/install-test/results.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve installation test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installation-${{ matrix.os }}
          path: ${{ runner.temp }}/install-test/results.log
          if-no-files-found: warn

  control-plane-platforms:
    name: Client contracts (${{ matrix.os }}, repeat ${{ matrix.repetition }})
    runs-on: ${{ matrix.os }}
    # Four real-time flow-consent lifecycles and eight cleanup traffic variants
    # extend the suite; individual CLI/RPC/probe deadlines remain unchanged.
    # The 53-root suite needs more than 30m on Windows (run 34710382160).
    # Bound execution to 40m; preserve setup and partial-report upload time.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm, windows-2022, windows-2025, macos-15, macos-15-intel]
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download pinned contract-test dependencies
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              git diff --exit-code -- go.mod go.sum
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done
          echo "Pinned dependency download failed after three attempts" >&2
          exit 1
      - name: Build real client and contract runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/client-contracts"
          go build -ldflags "-X main.commit=$GITHUB_SHA" -o "$RUNNER_TEMP/client-contracts/client.exe" ./cmd/endlessnet-client
          go build -o "$RUNNER_TEMP/client-contracts/packetprobe.exe" ./tools/packetprobe
          go test -c -o "$RUNNER_TEMP/client-contracts/contracts.test.exe" ./tests
          "$RUNNER_TEMP/client-contracts/contracts.test.exe" -test.list='^TestControlPlane' > "$RUNNER_TEMP/client-contracts/expected-tests.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/client-contracts/source.txt"
          printf '%s\n' '${{ matrix.os }}-${{ matrix.repetition }}' > "$RUNNER_TEMP/client-contracts/shard.txt"
      - name: Prepare signed Wintun dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'client-contracts'
          $archive = Join-Path $dir 'wintun.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw 'Wintun archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $dir 'wintun')
          Copy-Item -LiteralPath (Join-Path $dir 'wintun/wintun/bin/amd64/wintun.dll') -Destination (Join-Path $dir 'wintun.dll')
      - name: Run isolated contract repetition (Unix)
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 41
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            ENDLESSNET_CONTROL_TEST=1 ENDLESSNET_TEST_BINARY="$RUNNER_TEMP/client-contracts/client.exe" \
            ENDLESSNET_TEST_COMMIT="$GITHUB_SHA" \
            ENDLESSNET_PACKET_PROBE="$RUNNER_TEMP/client-contracts/packetprobe.exe" \
            "$RUNNER_TEMP/client-contracts/contracts.test.exe" \
            -test.run='^TestControlPlane' -test.count=1 -test.v -test.timeout=40m \
            2>&1 | tee "$RUNNER_TEMP/client-contracts/results.log"
      - name: Run isolated contract repetition (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 41
        env:
          ENDLESSNET_CONTROL_TEST: '1'
        run: |
          $env:ENDLESSNET_TEST_BINARY = Join-Path $env:RUNNER_TEMP 'client-contracts/client.exe'
          $env:ENDLESSNET_TEST_COMMIT = $env:GITHUB_SHA
          $env:ENDLESSNET_PACKET_PROBE = Join-Path $env:RUNNER_TEMP 'client-contracts/packetprobe.exe'
          & "$env:RUNNER_TEMP/client-contracts/contracts.test.exe" '-test.run=^TestControlPlane' '-test.count=1' '-test.v' '-test.timeout=40m' 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/client-contracts/results.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce machine-readable contract report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          go tool test2json -t -p client/contracts < "$RUNNER_TEMP/client-contracts/results.log" > "$RUNNER_TEMP/client-contracts/results.jsonl"
          echo "### Client contracts: ${{ matrix.os }}, repeat ${{ matrix.repetition }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'One isolated repetition; all three reports per platform are required by verify.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve platform contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-contracts-${{ matrix.os }}-${{ matrix.repetition }}
          path: |
            ${{ runner.temp }}/client-contracts/results.log
            ${{ runner.temp }}/client-contracts/results.jsonl
            ${{ runner.temp }}/client-contracts/expected-tests.txt
            ${{ runner.temp }}/client-contracts/source.txt
            ${{ runner.temp }}/client-contracts/shard.txt
          if-no-files-found: error

  control-plane:
    name: Client control-plane scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check contract participants under race detector
        run: go test -race ./internal/testcontrol ./internal/testrelay ./internal/testwireguard -count=1 -timeout 2m
      - name: Build real client and scenario runner
        run: |
          go build -o "$RUNNER_TEMP/control-client" ./cmd/endlessnet-client
          go build -o "$RUNNER_TEMP/packetprobe" ./tools/packetprobe
          go test -c -o "$RUNNER_TEMP/control-tests" ./tests
      - name: Run scenarios three times in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            ENDLESSNET_CONTROL_TEST=1 ENDLESSNET_TEST_BINARY="$RUNNER_TEMP/control-client" \
            ENDLESSNET_PACKET_PROBE="$RUNNER_TEMP/packetprobe" \
            unshare --net -- bash -c '
              set -euo pipefail
              ip link set lo up
              "$1" -test.run="^TestClientDataplane" -test.count=3 -test.v -test.timeout=8m
            ' bash "$RUNNER_TEMP/control-tests"

  container-client:
    name: Container client lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ubuntu:24.04
      options: --cap-add=NET_ADMIN --device=/dev/net/tun
    steps:
      - name: Install container test dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git iproute2 iptables iputils-ping
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build real client and container scenario
        shell: bash
        run: |
          set -euo pipefail
          # Configure trust in the shell's HOME too: the checkout action's
          # container HOME may differ from the one used by Go's VCS stamping.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain > /dev/null
          go build -o "$RUNNER_TEMP/container-client" ./cmd/endlessnet-client
          go build -o "$RUNNER_TEMP/container-packetprobe" ./tools/packetprobe
          go test -c -o "$RUNNER_TEMP/container-tests" ./tests
      - name: Exercise persistent and ephemeral container workloads
        shell: bash
        env:
          ENDLESSNET_CONTAINER_TEST: '1'
          ENDLESSNET_CONTROL_TEST: '1'
          ENDLESSNET_TEST_BINARY: ${{ runner.temp }}/container-client
          ENDLESSNET_PACKET_PROBE: ${{ runner.temp }}/container-packetprobe
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/container-tests" -test.run='^TestContainerWorkload$' -test.count=1 -test.v -test.timeout=10m

  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [verify-linux, verify-windows, verify-macos, installation, control-plane, control-plane-platforms, container-client]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Require identical successful contract coverage on every platform
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'client-contracts-*' --dir "$RUNNER_TEMP/contract-reports"
          go run ./tools/verify-contract-results "$RUNNER_TEMP/contract-reports" "$GITHUB_SHA" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require platform verification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ needs.verify-linux.result }}" = "success" ]
          [ "${{ needs.verify-windows.result }}" = "success" ]
          [ "${{ needs.verify-macos.result }}" = "success" ]
          [ "${{ needs.installation.result }}" = "success" ]
          [ "${{ needs.control-plane.result }}" = "success" ]
          [ "${{ needs.control-plane-platforms.result }}" = "success" ]
          [ "${{ needs.container-client.result }}" = "success" ]

  external-stun-compatibility:
    name: External STUN compatibility
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_stun_compatibility }}
    runs-on: ubuntu-latest
    needs: [verify-linux, verify-windows, verify-macos]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned STUN source
        uses: actions/checkout@v7
        with:
          repository: endless-net/stun
          ref: v1.0.10
          path: .external/endlessnet-stun
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build standalone STUN binary
        env:
          GOFLAGS: ""
          GOWORK: off
        run: go build -o "$RUNNER_TEMP/endlessnet-stun" ./cmd/endlessnet-stun
        working-directory: .external/endlessnet-stun
      - name: Verify current client against standalone STUN
        env:
          ENDLESSNET_E2E_STUN_BINARY: ${{ runner.temp }}/endlessnet-stun
        run: go test ./internal/client -run '^TestCheckSTUNQueriesExternalStandaloneService$' -count=1
