name: Go CI and release
on:
  push:
    branches: ['main']
    tags: ['v0.*', 'api/v0.*']
permissions:
  contents: read
  actions: read
env:
  GOPRIVATE: github.com/endless-net/*
  GONOPROXY: github.com/endless-net/*
  GONOSUMDB: github.com/endless-net/*
  GOWORK: 'off'
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_type == 'branch' && github.sha || 'release' }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit passed its required CI on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          workflow=ci.yml
          if [[ "$GITHUB_REF_NAME" == api/* ]]; then workflow=api-ci.yml; fi
          checked_sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
            --branch main --event push --commit "$GITHUB_SHA" --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          test "$checked_sha" = "$GITHUB_SHA"
      - name: Verify baseline
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Reject untrusted private API build context
        if: github.actor == 'dependabot[bot]' && !startsWith(github.ref, 'refs/tags/api/')
        run: |
          echo 'Private producer API credentials are unavailable in this build context' >&2
          exit 1
      - name: Create scoped producer API read token
        if: ${{ !startsWith(github.ref, 'refs/tags/api/') }}
        id: api-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.FIRST_PARTY_API_APP_ID }}
          private-key: ${{ secrets.FIRST_PARTY_API_APP_PRIVATE_KEY }}
          owner: endless-net
          repositories: billing,coordinator,identity,signing,client,relay,management
          permission-contents: read
      - name: Fetch pinned producer APIs with protected read-only access
        if: ${{ !startsWith(github.ref, 'refs/tags/api/') }}
        env:
          ENDLESSNET_API_READ_TOKEN: ${{ steps.api-token.outputs.token }}
        run: bash scripts/fetch-private-api.sh
      - name: Install pinned Go check tools
        if: github.ref == 'refs/heads/main'
        run: bash scripts/install-ci-tools.sh --go-only
      - name: Go tests, vulnerability scan and lint
        if: github.ref == 'refs/heads/main'
        run: go run ./scripts/ci check --go-only
      - name: Build declared release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./scripts/ci build --tag "$TAG" --go-only
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: client-release-${{ github.sha }}
          path: .artifacts
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
  release:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: client-release-${{ github.sha }}
          path: .artifacts
      - name: Publish exact checked tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: go run ./scripts/ci publish --tag "$TAG" --sha "$SOURCE_SHA" --go-only

  apt:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: client-release-${{ github.sha }}
          path: .artifacts
      - name: Install APT publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg
      - name: Create APT repository token
        id: apt-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APT_APP_ID }}
          private-key: ${{ secrets.APT_APP_PRIVATE_KEY }}
          owner: endless-net
          repositories: apt
          permission-contents: write
      - name: Checkout APT Pages repository
        uses: actions/checkout@v4
        with:
          repository: endless-net/apt
          ref: main
          path: apt-pages
          token: ${{ steps.apt-token.outputs.token }}
      - name: Verify package and sign APT index
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: bash scripts/publish-apt.sh .artifacts apt-pages "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Publish signed APT repository
        working-directory: apt-pages
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          git add -- "apt/pool/main/e/endlessnet-client/endlessnet-client_${version}_amd64.deb" \
            apt/dists/stable/{Release,InRelease,Release.gpg,main/binary-amd64/Packages,main/binary-amd64/Packages.gz}
          if git diff --cached --quiet; then
            echo "APT already contains this release"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish EndlessNet Client $version for Ubuntu amd64"
          git push origin HEAD:refs/heads/main
